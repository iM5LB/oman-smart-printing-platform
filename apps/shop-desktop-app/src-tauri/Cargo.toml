[package]
name = "shop-desktop-app"
version = "0.1.0"
description = "Oman Smart Printing — library desktop (Tauri)"
authors = ["OMSP"]
edition = "2021"

[lib]
name = "shop_desktop_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.17.2", features = ["gtk3"] }
