# Oman Smart Printing Platform — Render Blueprint
# https://dashboard.render.com/blueprint/new?repo=<YOUR_GITHUB_REPO_URL>
#
# Free Postgres expires after 30 days. Free web services spin down after inactivity.
# Uploads use local disk on the API service (ephemeral on free without a paid disk).

databases:
  - name: omsp-db
    plan: free
    databaseName: omsp
    user: omsp

services:
  - type: web
    name: omsp-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    # Prefer explicit filters so desktop apps are not part of the API image build.
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci --omit=optional && npx turbo run build --filter=@omsp/api
    # Push schema before start so missing tables (owner_sessions, etc.) cannot 500 register.
    # Keep preDeploy as a first attempt; start:api:render re-runs push if preDeploy was skipped in the UI.
    preDeployCommand: npm run db:push:prod
    startCommand: npm run start:api:render
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: omsp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PAYMENT_PROVIDER
        value: mock
      # OTP via Meta WhatsApp Cloud API only (no SMS). See docs/whatsapp-otp.md
      # Set WHATSAPP_TOKEN, WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_OTP_TEMPLATE_NAME in the dashboard.
      - key: SMS_PROVIDER
        value: whatsapp
      - key: WHATSAPP_BUSINESS_NUMBER
        value: "+96876655365"
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE_LANG
        value: ar
      - key: WHATSAPP_ORDER_READY_TEMPLATE_NAME
        sync: false
      - key: OTP_DEV_EXPOSE
        value: "false"
      - key: STORAGE_LOCAL_PATH
        value: /opt/render/project/src/apps/api/.data/uploads
      - key: MAX_FILE_SIZE_BYTES
        value: "52428800"
      - key: SIGNED_URL_TTL_SECONDS
        value: "300"
      - key: LIBRARY_SETUP_PASSWORD
        sync: false
      - key: API_URL
        fromService:
          name: omsp-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_API_URL
        fromService:
          name: omsp-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          name: omsp-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGIN
        value: "https://omsp-web.onrender.com,https://omsp.onrender.com,http://localhost:3000,http://localhost:1420,tauri://localhost,https://tauri.localhost"

  - type: web
    name: omsp-web
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    # Dashboard must use this build command (Blueprint does not always override a custom UI command).
    # packageManager is required by Turbo 2.10+; SWC is installed explicitly because --omit=optional skips it.
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci --omit=optional && npm run build:web:render
    startCommand: npm run start:web
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: omsp-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          name: omsp-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
